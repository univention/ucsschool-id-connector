variables:
  RUN_RENOVATE:
    value: "no"
    options:
      - "yes"
      - "no"
    description: "Set to yes if you want to run renovate"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_OPEN_MERGE_REQUESTS
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "webide"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
    - if: $RUN_RENOVATE == "yes"

include:
  - local: /.gitlab-ci/gitlab-ci.yml
    rules:
      - if: $RUN_RENOVATE != "yes"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sonarqube@2.15.0
    inputs:
      job_name: "build-sonar"
      stage: tests
      job_needs:
        - job: tests
          artifacts: true
    rules:
      - if: $RUN_RENOVATE != "yes"
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/renovate@2.15.0
    rules:
      - if: $RUN_RENOVATE == "yes"
