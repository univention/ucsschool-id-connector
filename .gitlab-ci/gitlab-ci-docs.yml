# The documentation child pipeline, triggered by the 'documentation' job in
# '.gitlab-ci/gitlab-ci.yml'.
#
# Building and checking the documentation, and publishing it to
# docs.software-univention.de, come from the 'sphinx-docs' component. The
# component brings the sphinx templates with it, pinned to a tag, so there is no
# 'univention/dev/docs/sphinx-docker' include here any more.

include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sphinx-docs@2.16.0
    inputs:
      docs_dir: "docs"
      doc_target_name: "ucsschool-id-connector"
      job_rules:
        - changes: &docs_changes
            - "docs/**/*"
            - "src/HISTORY.rst"
      merge_rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          changes: *docs_changes
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *docs_changes
          when: manual
      production_rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
          changes: *docs_changes
      # The documentation imports the project's own code, so its dependencies
      # have to be there before sphinx runs.
      before_script:
        - apt-get update; apt-get install --assume-yes --no-install-recommends build-essential python3-dev pipx
        - PIPX_BIN_DIR="/usr/local/bin" pipx install poetry==1.8.5
        - poetry --directory=src export -f requirements.txt --output requirements.txt
        - pip3 install -r requirements.txt

stages:
  - build
  - merge
  - staging
  - production

# Publishing to this project's own Pages site is not part of the component:
# it is the one thing the projects using it do differently.
#
# NOTE: this job does not currently deploy anything. A job publishes to Pages
# only if it is named 'pages' or carries the 'pages' keyword, and this is
# neither, so it has produced a 'public' artifact and nothing else since 2023 --
# the project's only Pages deployment outside the Allure reports is from
# 2023-08-17. Left as it was rather than fixed here, because starting to deploy
# would replace what is served at the root of the Pages site.
pages-staging:
  stage: staging
  rules:
    - changes: *docs_changes
      if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  image: $GIT_SYNC
  needs:
    - job: "docs:merge"
  variables:
    # The component sets this per job now, not globally.
    DOC_TARGET_NAME: "ucsschool-id-connector"
  script:
    - mv "$CI_PROJECT_DIR"/out/"$DOC_TARGET_NAME" public
  environment:
    name: staging/docs
    url: $CI_PAGES_URL
  artifacts:
    paths:
      - public

# Records the deployment of the production documentation. The merge request that
# actually publishes it is 'docs:production-merge-request', from the component.
pages-production:
  stage: production
  script:
    - "true"
  environment:
    name: production/docs
    url: https://docs.software-univention.de/ucsschool-id-connector/
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes: *docs_changes
