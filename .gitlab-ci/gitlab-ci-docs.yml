# The documentation child pipeline, triggered by the 'documentation' job in
# '.gitlab-ci/gitlab-ci.yml'.
#
# Building and checking the documentation, and publishing it to
# docs.software-univention.de, come from the 'sphinx-docs' component. The
# component brings the sphinx templates with it, pinned to a tag, so there is no
# 'univention/dev/docs/sphinx-docker' include here any more.

include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/sphinx-docs@2.16.0
    inputs:
      docs_dir: "docs"
      doc_target_name: "ucsschool-id-connector"
      job_rules:
        - changes: &docs_changes
            - "docs/**/*"
            - "src/HISTORY.rst"
      merge_rules:
        - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
          changes: *docs_changes
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          changes: *docs_changes
          when: manual
      production_rules:
        - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
          changes: *docs_changes
      # The documentation imports the project's own code, so its dependencies
      # have to be there before sphinx runs.
      before_script:
        - apt-get update; apt-get install --assume-yes --no-install-recommends build-essential python3-dev pipx
        - PIPX_BIN_DIR="/usr/local/bin" pipx install poetry==1.8.5
        - poetry --directory=src export -f requirements.txt --output requirements.txt
        - pip3 install -r requirements.txt

stages:
  - build
  - merge
  - staging
  - production

# Publishing to this project's own Pages site is not part of the component:
# it is the one thing the projects using it do differently.
#
# This job never published anything. A job reaches Pages only if it is named
# 'pages' or carries the 'pages' keyword, and it was neither, so it built a
# 'public' artifact that nothing collected. The site kept serving the upload
# from 2023-08-17 -- documentation for 2.2.7, while the project is on 4.0.0 --
# and the environment below advertised it as available the whole time.
#
# The 'pages' keyword fixes that without renaming the job. Naming it 'pages',
# which is how ucsschool-kelvin-rest-api does the same thing, is the older form
# and is deprecated; the keyword is what replaced it.
#
# No 'path_prefix', so this is the site's main deployment: it replaces what is
# at the root, which is the point, and it does not expire. The Allure reports
# live under 'allure-<ref>' prefixes and are untouched -- a deployment only
# replaces the ones carrying the same prefix.
pages-staging:
  stage: staging
  pages:
    publish: public
  rules:
    - changes: *docs_changes
      if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
  image: $GIT_SYNC
  # The two build jobs directly, rather than 'docs:merge'. Both write into
  # 'out/<target>' -- the HTML from one, the PDF from the other -- so their
  # artifacts land on top of each other and the directory is complete without
  # the merge.
  #
  # 'docs:merge' is manual on the default branch, and
  # 'docs:production-merge-request' hangs off it. Needing it here meant the only
  # way to refresh this site was a click that also opened a merge request
  # against docs.univention.de. Now the preview publishes by itself and going to
  # production stays the deliberate act it should be.
  #
  # Both jobs are needed, not just the HTML: conf.py sets
  # 'pdf_download_filename', so the rendered pages carry a download link that
  # would otherwise 404 here.
  needs:
    - job: "docs:html"
      artifacts: true
    - job: "docs:pdf"
      artifacts: true
  variables:
    # The component sets this per job now, not globally.
    DOC_TARGET_NAME: "ucsschool-id-connector"
  script:
    - mv "$CI_PROJECT_DIR"/out/"$DOC_TARGET_NAME" public
  environment:
    name: staging/docs
    url: $CI_PAGES_URL
  artifacts:
    paths:
      - public

# Records the deployment of the production documentation. The merge request that
# actually publishes it is 'docs:production-merge-request', from the component.
pages-production:
  stage: production
  script:
    - "true"
  environment:
    name: production/docs
    url: https://docs.software-univention.de/ucsschool-id-connector/
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      changes: *docs_changes
